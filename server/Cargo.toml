[package]
name = "calendario_zk_server"
version = "0.1.0"
edition = "2021"
description = "Servidor de sincronización zero-knowledge de Calendario y Tareas: solo guarda bloques cifrados"
license = "MIT"

[[bin]]
name = "calendario-zk-server"
path = "src/main.rs"

[lib]
name = "calendario_zk_server"
path = "src/lib.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
axum-server = { version = "0.7", features = ["tls-rustls"] }

[dev-dependencies]
calendario_core = { path = "../core" }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
