# Compila y prueba en Windows, macOS y Linux reales en cada push.
name: Compilar y probar

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: "Plataforma a compilar"
        type: choice
        default: todas
        options: [todas, ubuntu-latest, windows-latest, macos-latest]

jobs:
  core-tests:
    name: Pruebas del núcleo (con servidor CalDAV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Servidor CalDAV de pruebas (Radicale)
        run: |
          pip install radicale
          mkdir -p /tmp/radicale
          printf '[server]\nhosts = 127.0.0.1:5232\n[auth]\ntype = none\n[storage]\nfilesystem_folder = /tmp/radicale/col\n[rights]\ntype = owner_only\n' > /tmp/radicale/config
          nohup python -m radicale --config /tmp/radicale/config > /tmp/radicale/log 2>&1 &
          sleep 3
      - name: cargo test
        working-directory: core
        env:
          CALDAV_TEST_URL: http://127.0.0.1:5232/
          CALENDARIO_TZ: Europe/Madrid
        run: cargo test

  server:
    name: Servidor ZK (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Pruebas de extremo a extremo (servidor + dos equipos)
        if: runner.os == 'Linux'
        working-directory: server
        env:
          CALENDARIO_TZ: Europe/Madrid
        run: cargo test
      - name: Compilar
        working-directory: server
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: calendario-zk-server-${{ runner.os }}
          path: |
            server/target/release/calendario-zk-server
            server/target/release/calendario-zk-server.exe

  android:
    name: App (Android)
    needs: core-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Análisis estático (Dart)
        working-directory: app
        run: |
          flutter pub get
          flutter analyze lib tool
      - name: Compilar APK
        shell: bash
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          set -o pipefail
          ./tool/build_android.sh 2>&1 | tee build.log || {
            msg=$(grep -iE "error|fatal|failed|exception|what went wrong" -A2 build.log | tail -30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Fallo de compilación (Android)::${msg}"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: calendario-Android
          path: app/build/app/outputs/flutter-apk/app-release.apk

  build:
    name: App (${{ matrix.os }})
    needs: core-tests
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'workflow_dispatch' && inputs.os != 'todas') && fromJSON(format('["{0}"]', inputs.os)) || fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libayatana-appindicator3-dev libsecret-1-dev
      - name: Análisis estático (Dart)
        working-directory: app
        run: |
          flutter pub get
          flutter analyze lib tool
      - name: Compilar (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -o pipefail
          ./tool/build.sh 2>&1 | tee build.log || {
            # Publica el final del error como anotación (visible en el resumen de la ejecución).
            msg=$(grep -iE "error|fatal|undefined|failed|no such" build.log | tail -25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Fallo de compilación::${msg}"
            exit 1
          }
      - name: Compilar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tool/build.ps1 *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0 -or -not $?) {
            $msg = (Select-String -Path build.log -Pattern 'error|fatal|failed' | Select-Object -Last 25 | ForEach-Object { $_.Line }) -join '%0A'
            Write-Output "::error title=Fallo de compilación::$msg"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: calendario-${{ runner.os }}
          path: |
            app/build/linux/x64/release/bundle/
            app/build/windows/x64/runner/Release/
            app/build/macos/Build/Products/Release/calendario.app/
