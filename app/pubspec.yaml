name: calendario
description: Calendario y Tareas — app de escritorio local-first con núcleo Rust cifrado.
publish_to: none
version: 0.3.0+11

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  window_manager: ^0.5.0
  screen_retriever: ^0.2.0
  tray_manager: ^0.5.0
  # Android: selector de archivos, almacén seguro, abrir enlaces y documentos
  file_picker: ^13.3.0
  flutter_secure_storage: ">=9.0.0 <12.0.0"
  url_launcher: ^6.2.0
  open_filex: ">=4.3.0 <6.0.0"

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/icon/app_icon.ico
    - assets/icon/app_icon_64.png
